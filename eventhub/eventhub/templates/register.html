{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<h1>Create an account</h1>
<form class="card stack narrow" method="post" action="{{ url_for('auth.register') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next_url }}">
  <label for="name">Name</label>
  <input id="name" name="name" value="{{ form.get('name', '') }}" required maxlength="100" autocomplete="name">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required autocomplete="email">
  <label for="password">Password (min 8 characters)</label>
  <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
  <button type="submit">Sign up</button>
  <p class="muted">Use an @usf.edu address to get the student discount automatically. No student ID needed.</p>
</form>
{% endblock %}
