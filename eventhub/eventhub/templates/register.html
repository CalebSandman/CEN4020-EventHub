{% extends "base.html" %}
{% block title %}{{ tr('Sign up') }}{% endblock %}
{% block content %}
<h1>{{ tr('Create an account') }}</h1>
<form class="card stack narrow" method="post" action="{{ url_for('auth.register') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next_url }}">
  <label for="name">{{ tr('Name') }}</label>
  <input id="name" name="name" value="{{ form.get('name', '') }}" required maxlength="100" autocomplete="name">
  <label for="email">{{ tr('Email') }}</label>
  <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required autocomplete="email">
  <label for="password">{{ tr('Password (min 8 characters)') }}</label>
  <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
  <label for="home_currency">{{ tr('Home currency (default for ticket prices)') }}</label>
  <select id="home_currency" name="home_currency">
    {% for c in supported_currencies %}<option value="{{ c }}" {% if c == form.get('home_currency', 'USD') %}selected{% endif %}>{{ c }}</option>{% endfor %}
  </select>
  <button type="submit">{{ tr('Sign up') }}</button>
  <p class="muted">{{ tr('Use an @usf.edu address to get the student discount automatically. No student ID needed.') }}</p>
</form>
{% endblock %}
