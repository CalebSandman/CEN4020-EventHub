{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form class="card stack narrow" method="post" action="{{ url_for('auth.login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next_url }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required autocomplete="username">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required autocomplete="current-password">
  <button type="submit">Log in</button>
  <p>No account? <a href="{{ url_for('auth.register', next=next_url) }}">Sign up</a></p>
</form>
{% endblock %}
